  <title>Özel Eğitim Sınıfları Kontenjan Takip Programı</title>
  <style>
    :root {
      --primary: #1e3a8a;
      --primary-hover: #1d4ed8;
      --bg: #f1f5f9;
      --card-bg: #ffffff;
      --border: #cbd5e1;
      --text: #0f172a;
      --muted: #64748b;
      --danger: #dc2626;
      --success: #16a34a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 20px; line-height: 1.5; }
    .container { max-width: 1200px; margin: 0 auto; }
    
    /* Login Ekranı */
    #loginScreen { min-height: 80vh; display: flex; align-items: center; justify-content: center; }
    .login-card { background: #ffffff; border: 1px solid var(--border); border-radius: 12px; padding: 32px 24px; width: 100%; max-width: 400px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1); }
    .login-card h2 { font-size: 1.35rem; color: var(--primary); margin-bottom: 6px; text-align: center; }
    .login-card p { font-size: 0.85rem; color: var(--muted); margin-bottom: 24px; text-align: center; }
    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; font-size: 0.8rem; font-weight: 600; color: #334155; margin-bottom: 4px; }
    .form-group input { width: 100%; height: 42px; padding: 8px 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 0.95rem; outline: none; }
    .login-btn { width: 100%; height: 44px; background: var(--primary); color: white; border: none; border-radius: 8px; font-weight: 600; font-size: 1rem; cursor: pointer; margin-top: 6px; }
    .login-btn:hover { background: var(--primary-hover); }
    .login-error { color: var(--danger); font-size: 0.85rem; margin-top: 12px; text-align: center; display: none; }

    /* Ana Panel */
    #mainApp { display: none; }
    header { background: #ffffff; padding: 16px 20px; border-radius: 12px; border: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .header-left h1 { font-size: 1.3rem; color: var(--primary); }
    .header-left p { font-size: 0.82rem; color: var(--muted); }
    .header-right { display: flex; align-items: center; gap: 10px; }
    .user-tag { background: #e2e8f0; color: #1e293b; padding: 6px 12px; border-radius: 20px; font-size: 0.85rem; font-weight: 600; }
    .btn-logout { background: #fee2e2; color: var(--danger); border: 1px solid #fecaca; padding: 6px 12px; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 0.85rem; }

    .panel { background: var(--card-bg); border-radius: 12px; border: 1px solid var(--border); padding: 18px; margin-bottom: 20px; }
    .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; align-items: end; }
    button.btn-primary { height: 42px; background: var(--primary); color: #fff; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; }

    .section-title { font-size: 1.1rem; font-weight: 700; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
    .badge-count { background: #e2e8f0; font-size: 0.75rem; padding: 2px 8px; border-radius: 12px; color: #475569; }
    .category-group { margin-bottom: 24px; }
    .table-container { overflow-x: auto; background: var(--card-bg); border-radius: 10px; border: 1px solid var(--border); }
    table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.9rem; }
    th { background: #f8fafc; padding: 12px 14px; font-weight: 600; color: #334155; border-bottom: 2px solid var(--border); }
    td { padding: 12px 14px; border-bottom: 1px solid var(--border); vertical-align: middle; }
    
    .status-pill { font-weight: 700; padding: 4px 10px; border-radius: 6px; display: inline-block; font-size: 0.82rem; }
    .status-available { color: #15803d; background: #dcfce7; border: 1px solid #bbf7d0; }
    .status-full { color: #ffffff; background: #dc2626; border: 1px solid #b91c1c; }

    .btn-action { width: 36px; height: 36px; border: 1px solid var(--border); background: #ffffff; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 1.15rem; }
    .btn-action.plus { color: #16a34a; }
    .btn-action.minus { color: #dc2626; }
    .btn-action:disabled { opacity: 0.35; cursor: not-allowed; }
